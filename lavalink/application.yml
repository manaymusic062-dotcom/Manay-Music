server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.13.5"
      snapshot: false
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      http: true
      local: false
    # Audio smoothness (only used when you self-host Lavalink with this file).
    # A bigger buffer rides out network jitter; lower Opus quality / resampling
    # costs less CPU, which is what usually causes stuttering on small servers.
    bufferDurationMs: 800
    frameBufferDurationMs: 5000
    opusEncodingQuality: 6
    resamplingQuality: LOW
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 5

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - MUSIC
      - ANDROID_TESTSUITE
      - WEB
